<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>MMC Graduation Scanner</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f1f3f7;
      text-align: center;
      margin: 0;
      padding: 20px;
    }
    .card {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 22px;
      border-radius: 14px;
    }
    h1 { color: #173a70; }
    button {
      width: 100%;
      padding: 16px;
      margin: 8px 0;
      background: #173a70;
      color: white;
      border: 0;
      border-radius: 8px;
      font-size: 18px;
      font-weight: bold;
    }
    button:disabled { opacity: .5; }
    #reader { width: 100%; margin: 16px 0; }
    #result {
      padding: 18px;
      margin-top: 15px;
      border-radius: 10px;
      background: #fff3cd;
      overflow-wrap: anywhere;
      font-size: 18px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div id="googleSignIn">
  <button id="signInBtn" onclick="signInGoogle()">
    Sign in with Google
  </button>
  <p id="signInStatus">Not signed in</p>
</div>
    <h1>MMC Graduation Scanner</h1>
    <p>December 4, 2026</p>
    <button id="start" onclick="startScanner()">
      Start Camera
    </button>
    <button id="stop" onclick="stopScanner()" disabled>
      Stop Camera
    </button>
    <div id="reader"></div>
    <div id="result" role="status">
      Camera not started
    </div>
  </div>

  <script>
    let scanner;
    let active = false;
    let lastScan = 0;

    async function startScanner() {
      if (active) return;
      try {
        scanner = new Html5Qrcode("reader");
        await scanner.start(
          { facingMode: "environment" },
          { fps: 10, qrbox: 250 },
          code => {
            const now = Date.now();
            if (now - lastScan < 2000) return;
            lastScan = now;

            const validFormat =
              /^MMC26:[A-Za-z0-9_-]{15,80}$/.test(code);

            document.getElementById("result").textContent =
              validFormat
                ? "QR CODE READ SUCCESSFULLY"
                : "UNRECOGNIZED QR FORMAT";
          },
          () => {}
        );
        active = true;
        document.getElementById("start").disabled = true;
        document.getElementById("stop").disabled = false;
      } catch (error) {
        document.getElementById("result").textContent =
          "Camera error: " + String(error);
      }
    }

    async function stopScanner() {
      if (!active) return;
      await scanner.stop();
      scanner.clear();
      active = false;
      document.getElementById("start").disabled = false;
      document.getElementById("stop").disabled = true;
    }
    const GOOGLE_CLIENT_ID = '396718987346-ihten8abk00q29ae8kf338aosnpprj47.apps.googleusercontent.com';
const SCRIPT_ID = '1HCgAR9e0d4GYPFcI2T3XNrg6eeBTh60lO3WLRuptGVlzhD92B2ohc4H6';
    
async function verifyGraduationTicket(qrCode, staffInitials) {
  if (!googleAccessToken) {
    return {
      type: 'error',
      message: 'Please sign in with Google first.'
    };
  }

  const response = await fetch(
    `https://script.googleapis.com/v1/scripts/${encodeURIComponent(SCRIPT_ID)}:run`,
    {
      method: 'POST',
      headers: {
        'Authorization': `Bearer ${googleAccessToken}`,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        function: 'verify',
        parameters: [qrCode, staffInitials],
        devMode: false
      })
    }
  );

  const data = await response.json();

  if (!response.ok || data.error) {
    throw new Error(data.error?.message || 'Verification failed.');
  }

  if (data.response?.result) {
    return data.response.result;
  }

  throw new Error('No verification result returned.');
}
let googleAccessToken = null;

function signInGoogle() {
  if (!window.google || !google.accounts) {
    document.getElementById('signInStatus').textContent =
      'Google Sign-In is still loading. Try again.';
    return;
  }

  const client = google.accounts.oauth2.initTokenClient({
    client_id: GOOGLE_CLIENT_ID,
    scope: 'https://www.googleapis.com/auth/spreadsheets',
    callback: function(response) {
      if (response.error || !response.access_token) {
        document.getElementById('signInStatus').textContent =
          'Google sign-in failed.';
        return;
      }

      googleAccessToken = response.access_token;

      document.getElementById('signInStatus').textContent =
        'Google authorization successful';

      document.getElementById('signInBtn').textContent =
        'Reconnect Google';
    }
  });

  client.requestAccessToken();
}
  </script>
</body>
</html>
